services:
  - type: web
    name: tadreeb-plus
    env: php
    plan: free
    buildCommand: composer install --no-dev && php artisan config:cache && php artisan route:cache
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_ENV
        value: production
