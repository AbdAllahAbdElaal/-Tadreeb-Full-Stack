services:
  - type: web
    name: tadreeb-plus
    runtime: php # تم تحديث الكلمة هنا
    plan: free
    buildCommand: composer install --no-dev && php artisan config:cache && php artisan route:cache
    startCommand: apache2-foreground # أو استخدم الأمر الافتراضي للسيرفر
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_ENV
        value: production
      - key: PHP_VERSION
        value: 8.2 # تأكد أنها تتوافق مع نسخة مشروعك
